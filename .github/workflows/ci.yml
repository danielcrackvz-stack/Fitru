name: CI

on:
  push:
    branches: [main, cursor/**]
  pull_request:

jobs:
  nucleo:
    name: Libro, rutas y pagos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Dependencias
        working-directory: packages/kufi_core
        run: dart pub get
      - name: Analizar
        working-directory: packages/kufi_core
        run: dart analyze --fatal-infos
      - name: Tests
        working-directory: packages/kufi_core
        run: dart test

  app:
    name: App Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencias
        working-directory: apps/kufi
        run: flutter pub get
      - name: Analizar
        working-directory: apps/kufi
        run: flutter analyze
      - name: Tests
        working-directory: apps/kufi
        run: flutter test

  apk:
    name: APK de depuración
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencias
        working-directory: apps/kufi
        run: flutter pub get
      - name: APK debug
        working-directory: apps/kufi
        run: flutter build apk --debug
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: kufi-apk-debug
          path: apps/kufi/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  apk-release:
    name: APK release por ABI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencias
        working-directory: apps/kufi
        run: flutter pub get
      - name: APK release dividido por ABI
        working-directory: apps/kufi
        run: flutter build apk --release --split-per-abi
      - name: Subir APK release
        uses: actions/upload-artifact@v4
        with:
          name: subi-apk-release
          path: apps/kufi/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

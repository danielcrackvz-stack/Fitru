name: kufi
description: Billetera para pagar trufis y minibuses en Santa Cruz de la Sierra.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  kufi_core:
    path: ../../packages/kufi_core
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  go_router: ^16.2.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3
  geolocator: ^14.0.2
  flutter_local_notifications: ^19.4.2
  flutter_secure_storage: ^9.2.4
  flutter_blue_plus: ^1.35.5
  flutter_ble_peripheral: ^3.2.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/datos/rutas.geojson
    - assets/datos/rutas_nombres.csv
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fuentes/Inter-Regular.ttf
          weight: 400
        - asset: assets/fuentes/Inter-Medium.ttf
          weight: 500
        - asset: assets/fuentes/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fuentes/Inter-Bold.ttf
          weight: 700
